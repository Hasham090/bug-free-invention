[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shortsmith"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",

    # Database
    "sqlmodel>=0.0.21",

    # Video download
    "yt-dlp>=2026.3.17",

    # Transcription
    "faster-whisper>=1.2.1",

    # LLM
    "anthropic>=0.101.0",

    # ML / Vision
    "ultralytics>=8.3.0",
    "mediapipe>=0.10.35",
    "opencv-python-headless>=4.9.0",
    "filterpy>=1.4.5",

    # Video processing
    "python-ffmpeg>=2.0.0",
    "Pillow>=10.3.0",

    # Utils
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
whisperx = [
    "whisperx>=3.3.0",
    "torch>=2.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
